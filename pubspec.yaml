name: transaction_intent_signer
description: >-
  Pure Dart utilities for transaction intent challenges, operation terms
  hashing, optional liveness-aware summaries, and audit-friendly signed
  assertions.
version: 1.0.1
homepage: https://github.com/pvlKryu/transaction_intent_signer
repository: https://github.com/pvlKryu/transaction_intent_signer
issue_tracker: https://github.com/pvlKryu/transaction_intent_signer/issues

topics:
  - dart
  - fintech
  - security
  - audit
  - authentication

environment:
  sdk: ^3.0.0

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

dependencies:
  crypto: ^3.0.3
  meta: ^1.11.0
  uuid: ^4.4.0

dev_dependencies:
  # Wide ranges keep older local SDKs working while allowing newer Dart toolchains
  # (CI / pub.dev) to resolve current lints and test packages.
  lints: '>=4.0.0 <7.0.0'
  test: '>=1.25.0 <2.0.0'
